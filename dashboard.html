<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📺 員家魔法學院 - 大螢幕試煉即時看板 (方案 B 班級場次版)</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase 跨裝置即時通訊庫 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .db-header {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 2px solid var(--gold);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .db-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .db-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    @media (max-width: 1024px) {
      .db-grid { grid-template-columns: 1fr; }
    }
    .db-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .rank-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.5rem;
    }
    .rank-table th {
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      text-align: left;
    }
    .rank-row {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      transition: all 0.3s;
    }
    .rank-row td {
      padding: 1rem;
      font-size: 1rem;
    }
    .rank-row.rank-1 {
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.2), rgba(15, 23, 42, 0.5));
      border-left: 4px solid var(--gold);
    }
    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.1);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #7e22ce, var(--gold));
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s ease-out;
    }
    .timer-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }
    .qrcode-box {
      background: #ffffff;
      padding: 0.75rem;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
      margin-bottom: 0.75rem;
    }
    .qrcode-box img {
      width: 180px;
      height: 180px;
      display: block;
    }
    /* 班級選擇器樣式 */
    .session-selector-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(0,0,0,0.3);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 1rem;
    }
    .session-select {
      background: #0f172a;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- 頂部標頭 -->
  <header class="db-header">
    <div class="db-title">
      <span>✨ 員家魔法學院</span>
      <span id="header-session-name" style="font-size: 1.1rem; color: #a5b4fc; font-weight: 400;">| 高一 101 班 試煉大會</span>
    </div>
    <div style="display: flex; align-items: center; gap: 2rem;">
      <div id="game-status-badge" class="badge-tag badge-gold" style="font-size: 1rem; padding: 0.4rem 1rem;">
        🔮 試煉籌備中...
      </div>
      <div id="game-timer" class="timer-display">00:00</div>
    </div>
  </header>

  <!-- 數據監控網格 -->
  <div class="db-grid">
    <!-- 主區域：小隊即時解鎖進度排行榜 -->
    <div class="db-card">
      
      <!-- 方案 B：班級場次切換條 -->
      <div class="session-selector-bar">
        <span style="font-size: 0.9rem; color: var(--gold); font-weight: 700;">🏫 當前試煉班級：</span>
        <select id="select-session" class="session-select"></select>

        <button id="btn-add-session" class="btn btn-primary" style="font-size: 0.85rem; padding: 0.4rem 0.8rem;">
          ➕ 開啟新班級
        </button>

        <button id="btn-view-archive" class="btn" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
          📜 查看歷史成績歸檔
        </button>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 id="table-session-title" style="font-size: 1.3rem; color: var(--gold); margin: 0;">
          🏆 各小隊解鎖試煉排行榜
        </h2>
        <span id="registered-teams-count" style="font-size: 0.9rem; color: var(--text-muted);">
          已簽署契約小隊：0 組
        </span>
      </div>

      <table class="rank-table">
        <thead>
          <tr>
            <th style="width: 10%;">名次</th>
            <th style="width: 25%;">小隊名稱</th>
            <th style="width: 45%;">5 大魔法試煉總進度 (11 題)</th>
            <th style="width: 20%;">狀態 / 耗時</th>
          </tr>
        </thead>
        <tbody id="leaderboard-tbody">
          <!-- 動態渲染排行榜 -->
        </tbody>
      </table>
    </div>

    <!-- 側邊欄：QR Code 掃描區與導師控制台 -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      
      <!-- 📱 學生報到 QR Code 卡片 -->
      <div class="db-card" style="text-align: center;">
        <h3 style="font-size: 1.15rem; color: var(--gold); margin-top: 0; margin-bottom: 0.75rem;">
          📱 學生手機掃描報到 QR Code
        </h3>
        <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.75rem;">
          請同學打開相機掃描下方條碼或輸入網址即可進入試煉：
        </p>

        <div class="qrcode-box">
          <img id="db-qrcode-img" src="" alt="學生報到 QR Code">
        </div>

        <div id="db-student-url" style="font-size: 0.78rem; color: var(--secondary); font-family: monospace; word-break: break-all; background: rgba(0,0,0,0.3); padding: 0.4rem; border-radius: 6px; margin-bottom: 0.5rem;">
          載入網址中...
        </div>

        <button id="btn-copy-url" class="btn" style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
          📋 複製報到網址
        </button>
      </div>

      <!-- 🔮 導師控制台 -->
      <div class="db-card">
        <h3 style="font-size: 1.1rem; color: var(--gold); margin-top: 0; margin-bottom: 1rem;">
          🔮 試煉導師控制台
        </h3>

        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">
            獲勝名額設定（錄取前幾名）：
          </label>
          <input type="number" id="db-quota-input" class="input-field" value="3" min="1" max="10" style="width: 100px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <button id="btn-db-start" class="btn btn-success" style="font-size: 1rem; padding: 0.8rem;">
            🚀 開啟試煉門
          </button>
          <button id="btn-db-reset" class="btn btn-danger" style="font-size: 0.9rem; padding: 0.8rem;">
            🔄 重置當前班級
          </button>
        </div>
      </div>

      <!-- 📜 試煉即時動態日誌 -->
      <div class="db-card" style="flex: 1;">
        <h3 style="font-size: 1.1rem; color: var(--gold); margin-top: 0; margin-bottom: 0.75rem;">
          📜 試煉即時動態
        </h3>
        <div id="activity-log" style="font-size: 0.85rem; line-height: 1.6; color: var(--text-muted); max-height: 250px; overflow-y: auto;">
          <div>[系統] 魔法學院試煉看板已就緒...</div>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let timerInterval = null;

    // 自動生成學生端 URL 與 QR Code
    function initQRCode() {
      let currentUrl = window.location.href;
      let studentUrl = '';

      if (currentUrl.includes('dashboard.html')) {
        studentUrl = currentUrl.replace('dashboard.html', 'student.html');
      } else {
        studentUrl = currentUrl.replace(/\/$/, '') + '/student.html';
      }

      document.getElementById('db-student-url').textContent = studentUrl;
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(studentUrl)}`;
      document.getElementById('db-qrcode-img').src = qrApiUrl;

      document.getElementById('btn-copy-url').onclick = () => {
        navigator.clipboard.writeText(studentUrl).then(() => {
          alert("已成功複製報到網址至剪貼簿！");
        }).catch(() => {
          prompt("請複製以下網址：", studentUrl);
        });
      };
    }

    initQRCode();

    function updateTimerDisplay(startTime) {
      if (!startTime) {
        document.getElementById('game-timer').textContent = "00:00";
        return;
      }
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      document.getElementById('game-timer').textContent = `${mins}:${secs}`;
    }

    function renderDashboard(state) {
      const currentSession = window.gameEngine.getCurrentSession();
      const tbody = document.getElementById('leaderboard-tbody');
      const teamsCount = document.getElementById('registered-teams-count');
      const statusBadge = document.getElementById('game-status-badge');
      const quotaInput = document.getElementById('db-quota-input');
      const selectElem = document.getElementById('select-session');
      const headerSessionName = document.getElementById('header-session-name');
      const tableSessionTitle = document.getElementById('table-session-title');

      headerSessionName.textContent = `| ${currentSession.name} 試煉大會`;
      tableSessionTitle.textContent = `🏆 【${currentSession.name}】小隊試煉排行榜`;

      // 渲染班級選單
      if (state.sessions) {
        let selectHtml = '';
        Object.values(state.sessions).forEach(sess => {
          const isSel = sess.id === state.currentSessionId ? 'selected' : '';
          selectHtml += `<option value="${sess.id}" ${isSel}>${sess.name}</option>`;
        });
        selectElem.innerHTML = selectHtml;
      }

      quotaInput.value = currentSession.winningQuota || 3;

      if (currentSession.status === 'playing') {
        statusBadge.textContent = "🔮 魔法試煉進行中...";
        statusBadge.className = "badge-tag badge-gold";
        if (!timerInterval && currentSession.startTime) {
          timerInterval = setInterval(() => updateTimerDisplay(currentSession.startTime), 1000);
        }
      } else {
        statusBadge.textContent = "⏳ 魔法陣準備中...";
        statusBadge.className = "badge-tag";
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        updateTimerDisplay(null);
      }

      const sortedTeams = window.gameEngine.getSortedLeaderboard();
      teamsCount.textContent = `已簽署契約小隊：${sortedTeams.length} 組`;

      if (sortedTeams.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-muted);">
              目前【${currentSession.name}】尚無小隊報到，請同學掃描右側 QR Code 報到...
            </td>
          </tr>
        `;
        return;
      }

      let html = '';
      sortedTeams.forEach((team, idx) => {
        const rank = idx + 1;
        const stepIdx = typeof team.stepIndex === 'number' ? team.stepIndex : 0;
        const percent = Math.min(100, Math.round((stepIdx / 11) * 100));

        let rankBadge = `第 ${rank} 名`;
        if (rank === 1) rankBadge = '🥇 第 1 名';
        else if (rank === 2) rankBadge = '🥈 第 2 名';
        else if (rank === 3) rankBadge = '🥉 第 3 名';

        let statusTxt = `解答中 (${stepIdx}/11題)`;
        let rowClass = 'rank-row';
        if (rank === 1) rowClass += ' rank-1';

        if (team.completed) {
          const sec = Math.floor((team.finishTime - team.startTime) / 1000);
          const mins = Math.floor(sec / 60);
          const secs = sec % 60;
          statusTxt = `👑 通關 (${mins}分${secs}秒)`;
        }

        html += `
          <tr class="${rowClass}">
            <td style="font-weight: 700; color: var(--gold);">${rankBadge}</td>
            <td>
              <div style="font-weight: 700;">第 ${team.groupNum} 組 - ${team.name}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted);">${team.members || '組員未填寫'}</div>
            </td>
            <td>
              <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.3rem;">
                <span>封印進度：${stepIdx} / 11 題</span>
                <span>${percent}%</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${percent}%;"></div>
              </div>
            </td>
            <td style="font-weight: 700; color: ${team.completed ? 'var(--success)' : 'var(--text-light)'};">
              ${statusTxt}
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    // 班級切換事件
    document.getElementById('select-session').addEventListener('change', (e) => {
      const selectedId = e.target.value;
      const sess = window.gameEngine.state.sessions[selectedId];
      if (sess) {
        window.gameEngine.switchSession(sess.id, sess.name);
      }
    });

    // 建立新班級按鈕
    document.getElementById('btn-add-session').addEventListener('click', () => {
      const name = prompt("✨ 請輸入新班級/試煉梯次名稱（例如：102班 或 103班）：");
      if (name && name.trim()) {
        const cleanName = name.trim();
        const sessId = cleanName.endsWith('班') ? cleanName : `${cleanName}班`;
        window.gameEngine.switchSession(sessId, `高一 ${sessId}`);
        alert(`已成功切換至全新的【高一 ${sessId}】試煉！舊班級成績已安全歸檔。`);
      }
    });

    // 查看歷史歸檔按鈕
    document.getElementById('btn-view-archive').addEventListener('click', () => {
      const sessions = window.gameEngine.state.sessions || {};
      let archiveMsg = "📜 【歷史班級試煉成績歸檔】\n\n";
      Object.values(sessions).forEach(sess => {
        const sorted = window.gameEngine.getSortedLeaderboard(sess.id);
        archiveMsg += `🏫 ${sess.name} (共 ${sorted.length} 組小隊):\n`;
        if (sorted.length === 0) {
          archiveMsg += "  (尚無報到紀錄)\n";
        } else {
          sorted.slice(0, 3).forEach((t, idx) => {
            archiveMsg += `  第 ${idx + 1} 名: 第 ${t.groupNum} 組 - ${t.name} (${t.completed ? '通關' : '進行中'})\n`;
          });
        }
        archiveMsg += "\n";
      });
      alert(archiveMsg);
    });

    document.getElementById('btn-db-start').addEventListener('click', () => {
      window.gameEngine.startGame();
    });

    document.getElementById('btn-db-reset').addEventListener('click', () => {
      const sess = window.gameEngine.getCurrentSession();
      if (confirm(`⚠️ 確定要重置【${sess.name}】的比賽大會嗎？\n此操作將清空本班所有已報到小隊資料！`)) {
        window.gameEngine.resetGame();
        alert(`已成功重置【${sess.name}】！`);
      }
    });

    document.getElementById('db-quota-input').addEventListener('change', (e) => {
      window.gameEngine.setWinningQuota(e.target.value);
    });

    window.gameEngine.subscribe((state) => {
      renderDashboard(state);
    });
  </script>
</body>
</html>
