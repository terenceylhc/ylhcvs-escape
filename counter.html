<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💳 員家圖書館密室逃脫 - 流通櫃檯過卡審核端</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase 跨裝置即時通訊庫 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body style="background: #0f172a; color: white;">
  <nav class="navbar">
    <div class="brand">
      <span>💳 二樓流通櫃檯過卡審核端</span>
      <span style="opacity: 0.5;">|</span>
      <span>員林家商圖書館密室逃脫</span>
    </div>
    <div>
      <a href="dashboard.html" target="_blank" class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.875rem; text-decoration: none;">
        📺 開啟大螢幕 ↗
      </a>
    </div>
  </nav>

  <div class="dashboard-container" style="max-width: 900px; margin-top: 1.5rem;">
    
    <!-- 條碼槍直刷區域 -->
    <div class="card" style="text-align: center; border: 2px solid var(--secondary); background: rgba(6, 182, 212, 0.05); padding: 1.5rem;">
      <h2 style="font-size: 1.3rem; color: var(--gold); margin-bottom: 0.5rem;">🔫 1. 條碼槍自動刷書智慧比對區</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
        請點擊下方輸入框，使用條碼槍掃描學生帶來的【圖書條碼】。系統將<strong style="color:var(--gold);">自動比對條碼對應之組別</strong>並為該組完成過卡！
      </p>

      <input type="text" id="barcode-input" class="input-field" placeholder="請點此處，使用條碼槍掃描條碼..." style="font-size: 1.3rem; text-align: center; max-width: 480px; border-color: var(--secondary);" autofocus>
      <div id="barcode-msg" style="font-weight: 700; font-size: 1.05rem; color: var(--success); margin-top: 0.75rem; min-height: 1.5rem;"></div>
    </div>

    <!-- 館員一鍵手動點擊區域 -->
    <div class="card" style="margin-top: 1.5rem;">
      <h3 style="font-size: 1.1rem; color: var(--text-light); margin-bottom: 0.5rem;">👥 2. 櫃檯各組指定圖書與一鍵過卡</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
        當學生帶圖書至櫃檯，您亦可直接對照組別所持圖書，點擊【✅ 刷書認證通過】：
      </p>

      <div id="counter-teams-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem;">
        <!-- 動態載入各組 -->
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    function renderCounterUI(state) {
      const grid = document.getElementById('counter-teams-grid');
      grid.innerHTML = '';

      const teams = Object.values(state.teams || {});
      if (teams.length === 0) {
        grid.innerHTML = `<div style="color:var(--text-muted); padding:1rem; grid-column: 1/-1; text-align:center;">尚無隊伍報到...</div>`;
        return;
      }

      teams.forEach(team => {
        const div = document.createElement('div');
        div.className = 'card';
        div.style.margin = '0';
        div.style.padding = '1rem';
        div.style.background = team.completed ? 'rgba(16, 185, 129, 0.1)' : '#1e293b';
        div.style.border = team.completed ? '1px solid var(--success)' : '1px solid rgba(255,255,255,0.08)';

        const qInfo = window.gameEngine.getCurrentQuestionForTeam(team.id);
        const isAtLevel5 = !team.completed && qInfo && qInfo.catLevel === 5;
        const currentQ = qInfo ? qInfo.questionObj : null;

        let bookHint = "";
        let statusText = `<span style="color:var(--text-muted);">進度：第 ${team.stepIndex + 1} / 9 題</span>`;

        if (team.completed) {
          statusText = `<span style="color:var(--success); font-weight:700;">✅ 已全卡通關完賽</span>`;
        } else if (isAtLevel5) {
          statusText = `<span style="color:var(--gold); font-weight:700;" class="animate-pulse">📍 關卡五櫃檯過卡中！</span>`;
          if (currentQ && currentQ.bookTitle) {
            bookHint = `<div style="font-size:0.85rem; color:var(--secondary); margin-top:0.3rem; font-weight:600;">📘 指定過卡圖書：${currentQ.bookTitle}<br><span style="font-size:0.78rem; opacity:0.8;">(條碼/登錄號: ${currentQ.barcode})</span></div>`;
          }
        }

        div.innerHTML = `
          <div style="font-weight:700; font-size:1.05rem; margin-bottom:0.25rem;">
            【第 ${team.groupNum} 組】 ${team.name}
          </div>
          <div style="font-size:0.82rem; margin-bottom:0.5rem;">${statusText}</div>
          ${bookHint}
          <div style="margin-top:0.75rem;">
            ${team.completed 
              ? `<button class="btn" style="background:#334155; color:var(--text-muted); cursor:default; width:100%;" disabled>已完成通關</button>` 
              : `<button class="btn btn-success" style="width:100%;" onclick="passTeam('${team.id}')">✅ 刷書認證通過</button>`}
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function passTeam(teamId) {
      const state = window.gameEngine.state;
      const team = state.teams[teamId];
      if (!team) return;

      const qInfo = window.gameEngine.getCurrentQuestionForTeam(teamId);
      let currentQ = qInfo ? qInfo.questionObj : null;
      let ans = currentQ ? (Array.isArray(currentQ.answer) ? currentQ.answer[0] : currentQ.answer) : "PASS888";

      const bookName = currentQ && currentQ.bookTitle ? currentQ.bookTitle : "圖書";

      window.gameEngine.submitAnswer(teamId, ans);
      
      const msgBox = document.getElementById('barcode-msg');
      msgBox.style.color = "var(--success)";
      msgBox.innerHTML = `🎉 【第 ${team.groupNum} 組 - ${team.name}】出示 ${bookName} 成功完成實體過卡！`;
      setTimeout(() => { msgBox.innerHTML = ''; }, 5000);
    }

    // 條碼槍輸入智慧比對處理
    document.getElementById('barcode-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = e.target.value.trim().toLowerCase();
        e.target.value = '';
        if (!val) return;

        const msgBox = document.getElementById('barcode-msg');

        // 1. 取得所有未完賽隊伍
        const activeTeams = Object.values(window.gameEngine.state.teams || {}).filter(t => !t.completed);
        if (activeTeams.length === 0) {
          msgBox.style.color = "var(--gold)";
          msgBox.textContent = "所有隊伍皆已通關完賽！";
          return;
        }

        // 2. 智慧比對：哪一組當前題目的解答包含這張條碼 (val)
        let matchedTeam = activeTeams.find(team => {
          const qInfo = window.gameEngine.getCurrentQuestionForTeam(team.id);
          if (qInfo && qInfo.questionObj) {
            return window.gameEngine.checkAnswerMatch(val, qInfo.questionObj.answer);
          }
          return false;
        });

        if (matchedTeam) {
          passTeam(matchedTeam.id);
        } else {
          // 若掃描萬能測試碼 PASS888 或 999 ➔ 通過目前在關卡五最靠前的隊伍
          if (['pass888', '999'].includes(val)) {
            const l5Team = activeTeams.find(t => {
              const qInfo = window.gameEngine.getCurrentQuestionForTeam(t.id);
              return qInfo && qInfo.catLevel === 5;
            }) || activeTeams[0];
            if (l5Team) passTeam(l5Team.id);
          } else {
            msgBox.style.color = "var(--danger)";
            msgBox.innerHTML = `⚠️ 條碼 <code style="background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px;">${val}</code> 未匹配到任何目前在櫃檯隊伍的指定圖書！請確認書本。`;
          }
        }
      }
    });

    window.gameEngine.subscribe((state) => {
      renderCounterUI(state);
    });
  </script>
</body>
</html>
