<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 員家魔法學院 - 學生試煉端</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase 跨裝置即時通訊庫 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    .example-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px dashed var(--gold);
      border-radius: 8px;
      padding: 0.85rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .example-tag {
      display: inline-block;
      background: linear-gradient(135deg, #7e22ce, #4c1d95);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.4rem;
      border: 1px solid var(-  <!-- 頂部一體化導航條 -->
  <nav class="navbar">
    <div class="brand" style="font-size: 1.35rem;">
      <span>✨ 員家魔法學院</span>
      <span style="opacity: 0.5;">|</span>
      <span>學生試煉端</span>
    </div>
    <div id="team-header-info" style="font-size: 1rem; font-weight: 700; color: var(--gold);">
      未登錄小隊
    </div>
  </nav>

  <div class="student-container">
    
    <!-- 答題動態回饋 Modal 對話框 -->
    <div id="feedback-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div id="feedback-icon" style="font-size: 4.5rem; margin-bottom: 0.75rem;">🎉</div>
        <h2 id="feedback-title" style="font-size: 1.7rem; color: var(--gold); margin-bottom: 0.75rem; font-weight: 800;">
          答對了！你好棒！
        </h2>
        <p id="feedback-msg" style="font-size: 1.2rem; color: var(--text-light); line-height: 1.6; margin-bottom: 1.8rem;">
          暗號破譯成功！
        </p>
        <button id="btn-feedback-confirm" class="btn btn-success" style="font-size: 1.3rem; padding: 1rem;">
          ➡️ 進行下一題
        </button>
      </div>
    </div>

    <!-- 階段 1：填寫隊名報到卡 -->
    <div id="step-register" class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.6rem; color: var(--gold); margin-bottom: 0.6rem; font-weight: 800;">
          👥 成立魔法小隊，簽署契約
        </h2>
        <p style="font-size: 1.05rem; color: var(--text-muted); line-height: 1.6;">
          請每組（2~4 人）由一名代表輸入隊名，系統將自動為您開啟 5 大魔法封印 (共 11 題) 解鎖試煉：
        </p>
      </div>

      <div style="margin-bottom: 1.2rem;">
        <label style="font-size: 1.05rem; color: var(--text-muted); display: block; margin-bottom: 0.5rem; font-weight: 700;">
          魔法小隊名稱 (隊名)：
        </label>
        <input type="text" id="input-team-name" class="input-field" placeholder="例如：鳳凰魔法隊 (可自訂)" maxlength="15">
      </div>

      <div style="margin-bottom: 1.8rem;">
        <label style="font-size: 1.05rem; color: var(--text-muted); display: block; margin-bottom: 0.5rem; font-weight: 700;">
          小隊成員姓名 (以逗號分隔，選填)：
        </label>
        <input type="text" id="input-members" class="input-field" placeholder="例如：王小明, 李小美, 張大華">
      </div>

      <button id="btn-auto-register" class="btn btn-primary" style="font-size: 1.3rem; padding: 1.1rem;">
        🚀 簽署契約，進入魔法試煉
      </button>
    </div>

    <!-- 階段 2：等待導師開啟試煉門卡 -->
    <div id="step-waiting" class="card" style="display: none; text-align: center; padding: 2.5rem 1.2rem;">
      <div style="font-size: 4rem; margin-bottom: 1rem; animation: pulse 2s infinite;">⏳</div>
      <h2 id="waiting-team-title" style="font-size: 1.5rem; color: var(--gold); margin-bottom: 0.75rem; font-weight: 800;">
        契約簽署成功！
      </h2>
      <p style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1.8rem; line-height: 1.7;">
        小隊已順利登記於魔法結晶陣。<br>
        請觀看前方大螢幕，等待圖書館導師按下「🚀 開啟魔法試煉之門」！
      </p>

      <div style="background: rgba(255,255,255,0.05); padding: 1.2rem; border-radius: 12px; font-size: 1rem; color: var(--secondary); line-height: 1.6;">
        💡 小提醒：導師開啟試煉後，您的手機將自動跳轉出第 1 道關卡指南與題目，無需重新整理網頁！
      </div>

      <button id="btn-re-register" class="btn" style="margin-top: 1.8rem; background: transparent; border: 1px solid rgba(255,255,255,0.25); color: var(--text-muted); font-size: 0.95rem; padding: 0.6rem 1.2rem;">
        🔄 隊名填錯？重新報到
      </button>
    </div>

    <!-- 階段 3：關卡說明與獨立示範範例卡 -->
    <div id="step-level-intro" class="card" style="display: none; padding: 1.6rem 1.4rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
        <span id="intro-level-badge" class="badge-tag badge-gold" style="font-size: 1rem; padding: 0.4rem 0.8rem;">
          魔法試煉指南
        </span>
        <span style="font-size: 0.95rem; color: var(--text-muted);">📘 任務簡報</span>
      </div>

      <h2 id="intro-level-title" style="font-size: 1.45rem; color: var(--gold); margin-bottom: 0.9rem; font-weight: 800;">
        【關卡指南標題】
      </h2>

      <div id="intro-level-desc" style="font-size: 1.1rem; color: var(--text-light); line-height: 1.7; margin-bottom: 1.2rem;">
        關卡解題說明載入中...
      </div>

      <!-- 獨立範例框 -->
      <div id="intro-example-container" class="example-box" style="padding: 1.1rem; font-size: 1.05rem; line-height: 1.7;">
        <span class="example-tag" style="font-size: 0.9rem; padding: 0.25rem 0.6rem;">💡 解題模擬範例 (與正式題目無關)</span>
        <div id="intro-example-content" style="color: var(--text-muted); margin-top: 0.5rem;">
          範例說明...
        </div>
      </div>

      <button id="btn-start-level-questions" class="btn btn-primary" style="font-size: 1.3rem; padding: 1.1rem; margin-top: 1.8rem;">
        🚀 我知道了，開始答題！
      </button>
    </div>

    <!-- 階段 3.5：闖關解謎主畫面 -->
    <div id="step-game" class="card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
        <span id="level-badge" class="badge-tag badge-gold" style="font-size: 0.95rem; padding: 0.4rem 0.8rem;">
          試煉一 空間守護法則 (1/3題 | 全場 1/11 題)
        </span>
        <span id="level-location" style="display: none;"></span>
      </div>

      <h3 id="level-title" style="font-size: 1.4rem; color: #fff; margin-bottom: 1rem; font-weight: 800;">
        題目載入中...
      </h3>

      <div style="background: rgba(15, 23, 42, 0.7); padding: 1.2rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); margin-bottom: 1.2rem;">
        <p id="level-question-lbl" style="font-size: 1.2rem; line-height: 1.7; color: var(--text-light); white-space: pre-line; font-weight: 500;">
          題目內文...
        </p>
      </div>

      <!-- 提示區 (答錯 2 次才解鎖顯示，未滿 2 次不顯示任何鎖定警語) -->
      <div id="level-hint-box" style="display: none; background: rgba(16, 185, 129, 0.12); border-left: 4px solid var(--success); padding: 1rem 1.2rem; border-radius: 10px; font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.4rem;">
        <!-- 動態提示內容 -->
      </div>

      <div style="margin-bottom: 1.2rem;">
        <label style="font-size: 1.1rem; color: var(--gold); display: block; margin-bottom: 0.5rem; font-weight: 700;">
          ✏️ 請輸入解密密碼 / 暗號：
        </label>
        <input type="text" id="input-answer" class="input-field" placeholder="點此輸入答案..." autocomplete="off">
      </div>

      <div id="error-msg" style="color: var(--danger); font-size: 1rem; text-align: center; margin-bottom: 0.9rem; display: none;"></div>

      <button id="btn-submit-answer" class="btn btn-success" style="font-size: 1.3rem; padding: 1.1rem;">
        🔓 送出解鎖暗號
      </button>
    </div>

    <!-- 階段 3.8：單一關卡通關慶祝過場卡 -->
    <div id="step-level-clear" class="card" style="display: none; text-align: center; padding: 2.2rem 1.2rem;">
      <div style="font-size: 4rem; margin-bottom: 0.6rem;">🌟</div>
      <h2 id="level-clear-title" style="font-size: 1.6rem; color: var(--gold); margin-bottom: 0.9rem; font-weight: 800;">
        🎉 成功解開第 1 道魔法封印！
      </h2>
      <p id="level-clear-desc" style="font-size: 1.15rem; color: var(--text-light); line-height: 1.7; margin-bottom: 1.8rem;">
        你們小隊展現了優異的智慧，成功解除本區域魔法封印！
      </p>

      <div style="background: rgba(255,255,255,0.06); padding: 1.2rem; border-radius: 12px; font-size: 1.05rem; color: var(--secondary); margin-bottom: 1.8rem;">
        ✨ 試煉總進度：已解開 <span id="level-clear-progress" style="color: var(--gold); font-weight: 800; font-size: 1.3rem;">3</span> / 11 道封印
      </div>

      <button id="btn-next-level" class="btn btn-success" style="font-size: 1.3rem; padding: 1.1rem;">
        ➡️ 前往下一道魔法試煉
      </button>
    </div>

    <!-- 階段 4：終極通關卡 -->
    <div id="step-complete" class="card" style="display: none; text-align: center; padding: 2.5rem 1.2rem;">
      <div style="font-size: 4.5rem; margin-bottom: 0.6rem;">👑</div>
      <h2 style="font-size: 1.8rem; color: var(--gold); margin-bottom: 0.75rem; font-weight: 800;">恭喜榮獲【智慧金鑰】！</h2>
      <p style="font-size: 1.15rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 1.8rem;">
        你們成功解開員家圖書館 5 大魔法區域 11 大封印考驗，贏得圖書館賢者最高榮譽「智慧金鑰」！
      </p>

      <div style="background: rgba(255,255,255,0.06); padding: 1.4rem; border-radius: 14px; margin-bottom: 1.8rem;">
        <div style="font-size: 1rem; color: var(--text-muted);">試煉名次 / 總耗時</div>
        <div id="final-rank-display" style="font-size: 2.6rem; font-weight: 800; color: var(--success); margin: 0.3rem 0;">
          第 1 名
        </div>
        <div id="final-time-display" style="font-size: 1.25rem; color: var(--gold); font-family: monospace; font-weight: bold;">
          耗時：12 分 34 秒
        </div>
      </div>

      <p style="font-size: 1rem; color: var(--secondary);">
        請向圖書館導師展示此畫面核發「利用教育認證章與賢者魔法獎品」！
      </p>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    let currentTeamId = localStorage.getItem('ylhcvs_current_team_id') || null;
    let pendingNextStep = false; // 是否在等待學生關閉回饋彈窗後進入下一題

    // 顯示答題動態回饋 Modal
    function showAnswerFeedback(isCorrect, titleText, msgText) {
      const modal = document.getElementById('feedback-modal');
      const iconEl = document.getElementById('feedback-icon');
      const titleEl = document.getElementById('feedback-title');
      const msgEl = document.getElementById('feedback-msg');
      const btnConfirm = document.getElementById('btn-feedback-confirm');

      if (isCorrect) {
        iconEl.textContent = '🎉';
        titleEl.textContent = titleText || '答對了！你好棒！';
        titleEl.style.color = 'var(--gold)';
        msgEl.textContent = msgText || '暗號破譯成功！點擊下方按鈕進行下一題～';
        btnConfirm.className = 'btn btn-success';
        btnConfirm.innerHTML = '➡️ 進行下一題';
        pendingNextStep = true;
      } else {
        iconEl.textContent = '❌';
        titleEl.textContent = titleText || '不是這個答案喔！';
        titleEl.style.color = 'var(--danger)';
        msgEl.textContent = msgText || '再仔細想看看，加油！';
        btnConfirm.className = 'btn btn-primary';
        btnConfirm.innerHTML = '💪 我知道了，再試一次！';
        pendingNextStep = false;
      }

      modal.style.display = 'flex';
    }

    document.getElementById('btn-feedback-confirm').addEventListener('click', () => {
      document.getElementById('feedback-modal').style.display = 'none';
      if (pendingNextStep) {
        pendingNextStep = false;
        renderStudentUI(window.gameEngine.state);
      } else {
        const inputAns = document.getElementById('input-answer');
        if (inputAns) {
          inputAns.focus();
          inputAns.select();
        }
      }
    });

    // 5 大關卡魔法主題解題指南設定
    const LEVEL_GUIDES = {
      1: {
        title: "📌 試煉一：【圖書塔空間守護法則】解謎攻略",
        desc: "請對照【圖書館館舍介紹】與現場空間標示，依照題目中的算式規則計算出數字密碼。",
        example: "<b>【模擬示範題目】</b><br>(當期雜誌外借冊數 + 圖書借期週數) × 自主學習區樓層 ＝ ？<br><br><b>【解題示範步驟】</b><br>1. 參閱規定可知：當期雜誌外借＝<b>0</b> 冊、圖書借期＝<b>2</b> 週、自主學習區在 <b>2</b> 樓。<br>2. 帶入算式計算：<span style='color:var(--gold);'>(0 + 2) × 2 ＝ 4</span><br><b>👉 答案請輸入：4</b>"
      },
      2: {
        title: "🔮 試煉二：【WebOPAC 靈魂水晶檢索】解謎攻略",
        desc: "請使用手機或現場電腦開啟學校【員林家商圖書館館藏查詢系統】，搜尋指定書名並點入詳細頁面尋找作者與出版年份。",
        example: "<b>【模擬示範題目】</b><br>請在館藏查詢系統搜尋《被討厭的勇氣》，將【作者姓名】+【出版年份】拼湊成密碼：<br><br><b>【解題示範步驟】</b><br>1. 在館藏查詢系統輸入《被討厭的勇氣》搜尋並點入詳細頁面。<br>2. 查出作者姓名為「岸見一郎」、出版年份為「2014」。<br><b>👉 答案請輸入：岸見一郎2014</b> (或 岸見一郎14)"
      },
      3: {
        title: "📚 試煉三：【二樓禁書區號段封印】解謎攻略",
        desc: "請前往【二樓書庫】，根據題目給予的索書號找到該架位圖書，目視查看【書背標籤處】貼紙英文字母。<br><span style='color:var(--gold); font-weight:700;'>💡 提醒：字母輸入「大小寫皆可」（例如 LION 或 lion 皆算正確）！</span><br><span style='color:var(--danger); font-weight:700;'>⚠️ 注意：目視查看即可，請勿拿取或抽取書籍！</span>",
        example: "<b>【模擬示範題目】</b><br>目視查看 4 本圖書標籤貼紙字母：<br>❶[索書號 855.1...] ❷[索書號 855.1...]<br>❸[索書號 855.1...] ❹[索書號 855.1...]<br><br><b>【解題示範步驟】</b><br>前往指定架位，依序目視看見貼紙字母 L, I, O, N。<br><b>👉 答案請輸入：lion (大寫 LION 或小寫 lion 皆可)</b>"
      },
      4: {
        title: "📰 試煉四：【期刊架歷史符文密碼】解謎攻略",
        desc: "請前往一樓【當期期刊區】或【過期期刊區】，現場尋找題目指定的兩本刊物，依題目指示計算數字或拼湊刊名字元！",
        example: "<b>【模擬範例一 (數字相加)】</b><br>尋找《今周刊》與《鄉間小路》，將兩本代號【數字部分相加】？<br>👉 現場找到今周刊代號 C3 (數字3)、鄉間小路代號 B6 (數字6) ➔ 相加 3+6=9 ➔ 輸入：<b>9</b><br><br><b>【模擬範例二 (文字拼湊)】</b><br>尋找《今周刊》第 1 字 ＋ 《國家地理》第 1 字？<br>👉 現場找到「今」與「國」 ➔ 輸入：<b>今國</b>"
      },
      5: {
        title: "🏆 試煉五：【流通櫃台過卡魔法驗證】終極考驗",
        desc: "終極任務！請先透過【員林家商圖書館館藏查詢系統】查出指定圖書的索書號與架位，<b>全組帶著學生證與該本書籍</b>至二樓流通櫃台，向館員導師刷條碼驗證過卡！",
        example: "<b>【解題示範步驟】</b><br>1. 先至館藏系統查詢指定圖書索書號。<br>2. 全組一起去二樓書庫找到該本指定圖書。<br>3. 帶著圖書與學生證給二樓流通櫃台導師過卡！<br><b>👉 櫃台導師刷卡成功即可順利奪得全卡通關金鑰！</b>"
      }
    };

    function renderStudentUI(state) {
      const teams = state.teams || {};

      if (currentTeamId && !teams[currentTeamId]) {
        currentTeamId = null;
        localStorage.removeItem('ylhcvs_current_team_id');
      }

      if (!currentTeamId || !teams[currentTeamId]) {
        document.getElementById('step-register').style.display = 'block';
        document.getElementById('step-waiting').style.display = 'none';
        document.getElementById('step-level-intro').style.display = 'none';
        document.getElementById('step-game').style.display = 'none';
        document.getElementById('step-level-clear').style.display = 'none';
        document.getElementById('step-complete').style.display = 'none';
        document.getElementById('team-header-info').textContent = "未登錄小隊";
        
        const regBtn = document.getElementById('btn-auto-register');
        if (regBtn) {
          regBtn.disabled = false;
          regBtn.innerHTML = "🚀 簽署契約，進入魔法試煉";
        }
        return;
      }

      const team = teams[currentTeamId];
      document.getElementById('team-header-info').textContent = `👥 【第 ${team.groupNum} 組】 ${team.name}`;

      if (team.completed) {
        document.getElementById('step-register').style.display = 'none';
        document.getElementById('step-waiting').style.display = 'none';
        document.getElementById('step-level-intro').style.display = 'none';
        document.getElementById('step-game').style.display = 'none';
        document.getElementById('step-level-clear').style.display = 'none';
        document.getElementById('step-complete').style.display = 'block';

        const sorted = window.gameEngine.getSortedLeaderboard();
        const rankIndex = sorted.findIndex(t => t.id === team.id) + 1;
        document.getElementById('final-rank-display').textContent = `第 ${rankIndex} 名`;

        if (team.finishTime && team.startTime) {
          const sec = Math.floor((team.finishTime - team.startTime) / 1000);
          const mins = Math.floor(sec / 60);
          const secs = sec % 60;
          document.getElementById('final-time-display').textContent = `總耗時：${mins} 分 ${secs} 秒`;
        }
        return;
      }

      // 未開賽 ➔ 等待區
      if (state.status !== 'playing') {
        document.getElementById('step-register').style.display = 'none';
        document.getElementById('step-waiting').style.display = 'block';
        document.getElementById('step-level-intro').style.display = 'none';
        document.getElementById('step-game').style.display = 'none';
        document.getElementById('step-level-clear').style.display = 'none';
        document.getElementById('step-complete').style.display = 'none';
        document.getElementById('waiting-team-title').textContent = `【第 ${team.groupNum} 組 - ${team.name}】契約簽署成功！`;
        return;
      }

      // 比賽中：檢查是否處於關卡通關過場節點 (stepIndex 觸發點: 3, 6, 7, 10)
      const stepIdx = typeof team.stepIndex === 'number' ? team.stepIndex : 0;
      const ackStep = parseInt(localStorage.getItem('ylhcvs_ack_step_' + currentTeamId) || '0');

      if ((stepIdx === 3 || stepIdx === 6 || stepIdx === 7 || stepIdx === 10) && ackStep < stepIdx) {
        document.getElementById('step-register').style.display = 'none';
        document.getElementById('step-waiting').style.display = 'none';
        document.getElementById('step-level-intro').style.display = 'none';
        document.getElementById('step-game').style.display = 'none';
        document.getElementById('step-level-clear').style.display = 'block';
        document.getElementById('step-complete').style.display = 'none';

        const clearInfo = {
          3: { title: "🎉 成功解開第 1 道魔法封印！", desc: "你們小隊成功破譯館舍空間守護法則的 3 大算式，獲得前往第 2 道試煉的魔法權限！", nextName: "試煉二：靈魂水晶檢索" },
          6: { title: "🎉 成功解開第 2 道魔法封印！", desc: "你們小隊成功在館藏系統查出 3 大圖書密碼，獲得前往第 3 道試煉的魔法權限！", nextName: "試煉三：二樓禁書區號段封印" },
          7: { title: "🎉 成功解開第 3 道魔法封印！", desc: "你們小隊成功在二樓禁書區號段收集到英文字母暗號，獲得前往第 4 道試煉的魔法權限！", nextName: "試煉四：期刊架歷史符文密碼" },
          10: { title: "🎉 成功解開第 4 道魔法封印！", desc: "你們小隊成功在當期與過期期刊區解開 3 大符文密碼，獲得前往終極第 5 道試煉的魔法權限！", nextName: "試煉五：流通櫃台過卡驗證" }
        };

        const currentClear = clearInfo[stepIdx];
        if (currentClear) {
          document.getElementById('level-clear-title').textContent = currentClear.title;
          document.getElementById('level-clear-desc').textContent = currentClear.desc;
          document.getElementById('level-clear-progress').textContent = `${stepIdx}`;
          document.getElementById('btn-next-level').innerHTML = `➡️ 前往【${currentClear.nextName}】`;
        }
        return;
      }

      // 比賽中：獲取當前題目資訊
      const qInfo = window.gameEngine.getCurrentQuestionForTeam(currentTeamId);
      if (!qInfo || !qInfo.questionObj) return;

      const catLevel = qInfo.catLevel;
      const seenIntro = localStorage.getItem('ylhcvs_intro_seen_' + currentTeamId + '_' + catLevel);

      // 檢查是否尚未查看本關卡說明攻略
      if (!seenIntro) {
        document.getElementById('step-register').style.display = 'none';
        document.getElementById('step-waiting').style.display = 'none';
        document.getElementById('step-level-intro').style.display = 'block';
        document.getElementById('step-game').style.display = 'none';
        document.getElementById('step-level-clear').style.display = 'none';
        document.getElementById('step-complete').style.display = 'none';

        const guide = LEVEL_GUIDES[catLevel] || LEVEL_GUIDES[1];
        document.getElementById('intro-level-badge').textContent = `試煉 ${catLevel} 指南`;
        document.getElementById('intro-level-title').textContent = guide.title;
        document.getElementById('intro-level-desc').innerHTML = guide.desc;
        document.getElementById('intro-example-content').innerHTML = guide.example;
        return;
      }

      // 比賽中 ➔ 顯示題目頁
      document.getElementById('step-register').style.display = 'none';
      document.getElementById('step-waiting').style.display = 'none';
      document.getElementById('step-level-intro').style.display = 'none';
      document.getElementById('step-game').style.display = 'block';
      document.getElementById('step-level-clear').style.display = 'none';
      document.getElementById('step-complete').style.display = 'none';

      const qObj = qInfo.questionObj;

      const levelNames = { 1: "試煉一 空間法則", 2: "試煉二 靈魂水晶", 3: "試煉三 禁書號段", 4: "試煉四 歷史符文", 5: "試煉五 櫃台驗證" };
      const currentLName = levelNames[qInfo.catLevel] || `試煉 ${qInfo.catLevel}`;

      document.getElementById('level-badge').textContent = `${currentLName} (${qInfo.levelSubStep}/${qInfo.levelSubTotal}題 | 全場 ${qInfo.stepNumber}/11 題)`;
      document.getElementById('level-title').textContent = qObj.title || '圖書館試煉關卡';
      document.getElementById('level-question-lbl').textContent = qObj.question || '請輸入解密密碼：';

      // 求救提示盒控制：答錯達到 2 次時才顯示，未滿 2 次完全隱藏，不顯示任何「答錯兩次會有提示」文字
      const hintBox = document.getElementById('level-hint-box');
      if (qInfo.failedAttempts >= 2) {
        hintBox.style.display = 'block';
        hintBox.innerHTML = `<span style="color:var(--success); font-weight:800; font-size:1.15rem;">💡 求救提示已開啟：</span><br><div style="margin-top:0.4rem; color:var(--text-light); font-size:1.1rem;">${qObj.hint || '請仔細檢索並對照欄位算式！'}</div>`;
      } else {
        hintBox.style.display = 'none';
      }

      document.getElementById('input-answer').value = '';
      document.getElementById('error-msg').style.display = 'none';
    }

    document.getElementById('btn-auto-register').addEventListener('click', () => {
      const regBtn = document.getElementById('btn-auto-register');
      const teamNameInput = document.getElementById('input-team-name');
      const membersInput = document.getElementById('input-members');

      let teamName = teamNameInput.value.trim();
      if (!teamName) {
        teamName = "員家闖關隊";
        teamNameInput.value = teamName;
      }
      const members = membersInput.value.trim();

      regBtn.disabled = true;
      regBtn.innerHTML = "⏳ 正在進入魔法陣等待區...";

      try {
        const newTeam = window.gameEngine.autoRegisterTeam(teamName, members);
        currentTeamId = newTeam.id;
        localStorage.setItem('ylhcvs_current_team_id', currentTeamId);
        
        renderStudentUI(window.gameEngine.state);
      } catch (err) {
        console.error("報到發生異常：", err);
        alert("報到異常：" + err.message);
        regBtn.disabled = false;
        regBtn.innerHTML = "🚀 簽署契約，進入魔法試煉";
      }
    });

    document.getElementById('btn-re-register').addEventListener('click', () => {
      currentTeamId = null;
      localStorage.removeItem('ylhcvs_current_team_id');
      renderStudentUI(window.gameEngine.state);
    });

    document.getElementById('btn-next-level').addEventListener('click', () => {
      if (!currentTeamId) return;
      const team = window.gameEngine.state.teams[currentTeamId];
      if (team && typeof team.stepIndex === 'number') {
        localStorage.setItem('ylhcvs_ack_step_' + currentTeamId, team.stepIndex.toString());
      }
      renderStudentUI(window.gameEngine.state);
    });

    document.getElementById('btn-start-level-questions').addEventListener('click', () => {
      if (!currentTeamId) return;
      const qInfo = window.gameEngine.getCurrentQuestionForTeam(currentTeamId);
      if (qInfo) {
        localStorage.setItem('ylhcvs_intro_seen_' + currentTeamId + '_' + qInfo.catLevel, '1');
      }
      renderStudentUI(window.gameEngine.state);
    });

    document.getElementById('btn-submit-answer').addEventListener('click', () => {
      if (!currentTeamId) return;
      const ansInput = document.getElementById('input-answer');
      const errorMsg = document.getElementById('error-msg');
      const answerVal = ansInput.value.trim();

      if (!answerVal) {
        showAnswerFeedback(false, "未輸入解答喔！", "請在輸入框填寫密碼或暗號後再送出～");
        return;
      }

      const res = window.gameEngine.submitAnswer(currentTeamId, answerVal);
      if (res.success) {
        errorMsg.style.display = 'none';
        showAnswerFeedback(true, "🎉 答對了！你好棒！", "暗號破譯成功！太厲害了，請點擊下方按鈕繼續挑戰！");
      } else {
        errorMsg.textContent = res.message;
        errorMsg.style.display = 'none';
        showAnswerFeedback(false, "❌ 不是這個答案喔！", "暗號不太對，再仔細想看看、檢查一下喔！💪");
      }
    });

    document.getElementById('input-answer').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btn-submit-answer').click();
      }
    });

    window.gameEngine.subscribe((state) => {
      renderStudentUI(state);
    });
  </script>
</body>
</html>
